name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: Supabase publication snapshot
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blog-pages
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  BLOG_RELEASE_ID: ${{ inputs.release_id }}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mark publication running
        if: inputs.release_id != ''
        run: node scripts/report-deployment.mjs building
        env:
          BLOG_CALLBACK_SECRET: ${{ secrets.BLOG_CALLBACK_SECRET }}
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark publication online
        if: success() && inputs.release_id != ''
        run: node scripts/report-deployment.mjs live
        env:
          BLOG_CALLBACK_SECRET: ${{ secrets.BLOG_CALLBACK_SECRET }}
      - name: Mark publication failed
        if: failure() && inputs.release_id != '' && steps.deployment.outcome != 'success'
        run: node scripts/report-deployment.mjs failed
        env:
          BLOG_CALLBACK_SECRET: ${{ secrets.BLOG_CALLBACK_SECRET }}
