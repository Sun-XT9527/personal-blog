name: Publish blog
on:
  push:
    branches: [main]
  schedule:
    # UTC even hours also fall on even hours in Asia/Shanghai (00:02, 02:02, ...).
    - cron: '2 */2 * * *'
  workflow_dispatch:
    inputs:
      release_id:
        description: Supabase publication snapshot
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blog-pages
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.selection.outputs.release_id }}
      should_build: ${{ steps.selection.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: selection
        run: node scripts/pick-release.mjs
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
  publish:
    needs: select
    if: needs.select.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      BLOG_RELEASE_ID: ${{ needs.select.outputs.release_id }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Mark publication running
        if: env.BLOG_RELEASE_ID != ''
        run: node scripts/report-deployment.mjs building
        env:
          BLOG_CALLBACK_SECRET: ${{ secrets.BLOG_CALLBACK_SECRET }}
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark publication online
        if: success() && env.BLOG_RELEASE_ID != ''
        run: node scripts/report-deployment.mjs live
        env:
          BLOG_CALLBACK_SECRET: ${{ secrets.BLOG_CALLBACK_SECRET }}
      - name: Mark publication failed
        if: failure() && env.BLOG_RELEASE_ID != '' && steps.deployment.outcome != 'success'
        run: node scripts/report-deployment.mjs failed
        env:
          BLOG_CALLBACK_SECRET: ${{ secrets.BLOG_CALLBACK_SECRET }}
